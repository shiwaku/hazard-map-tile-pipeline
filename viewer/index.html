<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>ハザードマップタイルビューワ</title>
  <meta name="description" content="浸水想定区域のパレットPNG / 数値PNG タイルを表示し、クリックで画素値から浸水深・ランクを読み取るビューワ" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#2a78d6" />
  <link rel="icon" type="image/png" href="icons/favicon-32.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ハザードタイル" />
</head>
<body>
  <div id="map"></div>

  <section id="panel" class="panel" aria-label="コントロールパネル">
    <header class="panel-head">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">🌊</span>
        <h1>ハザードタイルビューワ</h1>
      </div>
      <div class="head-actions">
        <button id="theme-btn" class="icon-btn" type="button" title="テーマ切替" aria-label="テーマ切替"></button>
        <button id="collapse-btn" class="icon-btn" type="button" title="パネル開閉" aria-label="パネル開閉"></button>
      </div>
    </header>

    <div id="panel-body" class="panel-body">
      <div id="status" class="status" hidden></div>

      <div class="field">
        <div class="field-head">
          <span class="field-label">タイルセット</span>
          <div class="field-actions">
            <button id="all-on" class="mini-btn" type="button">全ON</button>
            <button id="all-off" class="mini-btn" type="button">全OFF</button>
          </div>
        </div>
        <div id="layers" class="toggles"></div>
      </div>

      <p class="hint">
        地図をクリックすると、その地点のタイル画素から値を読み取ります。<br />
        パレットPNGは色から凡例項目を、数値PNGは RGB から実数を復元します。
      </p>
    </div>

    <footer class="panel-foot">
      タイルは <a href="https://github.com/shiwaku/hazard-map-tile-pipeline" target="_blank" rel="noopener">hazard-map-tile-pipeline</a> で生成<br />
      仕様: 産総研 <a href="https://gsj-seamless.jp/labs/datapng/gridpngtileSpec.html" target="_blank" rel="noopener">グリッドPNGタイル</a><br />
      背景: 国土地理院 最適化ベクトルタイル / 全国最新写真<br />
      <span id="build-ver" class="build-ver"></span>
    </footer>
  </section>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
